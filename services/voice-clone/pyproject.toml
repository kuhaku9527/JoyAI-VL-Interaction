[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "joyvl-voice-clone"
version = "0.1.0"
description = "MiniMax voice-clone and TTS API for the JoyAI-VL stack"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "Apache-2.0"}
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.12.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
joyvl-voice-clone = "voice_clone_api.main:main"

[tool.setuptools]
packages = ["voice_clone_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
