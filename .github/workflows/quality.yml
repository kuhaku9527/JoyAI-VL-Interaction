# ---------------------------------------------------------------------------
# quality.yml — CI quality gate (GitHub Actions).
#
# Triggers on every push and every PR targeting `main` and BLOCKS merge when
# the lint / format checks fail.
#
# Scope strategy
# --------------
# Lint is scoped to `services/webinfer` — the currently active development
# package — rather than the whole monorepo. The rest of the repo carries large
# amounts of pre-existing *decorative* lint debt (ambiguous-unicode strings in
# Chinese comments, PEP 585/604 style annotations, missing docstrings on every
# public symbol, test/loop naming, etc.) that would make a repo-wide gate red
# on day one and mask real signal.
#
# Within `services/webinfer` we still enforce the rules that catch *real* bugs
# and regressions (F = pyflakes undefined names / unused imports, E402 = import
# ordering, I = isort, B = bugbear, C4 = comprehensions, SIM = simplify, plus
# the few E/W basics). We `--extend-ignore` only the decorative rules that were
# measured to remain after `ruff --fix` + `ruff format` in the enabling PR
# (see `ruff check services/webinfer --statistics`). Those historical-debt
# rules are: RUF001, RUF003, UP007, D101, D102, D103, D205, D401, RUF005,
# RUF013, SIM105, SIM108.
#
# This keeps the gate green AND meaningful: it intercepts genuine defects in new
# code while forgiving cosmetic debt that is out of scope to chase down now.
# ---------------------------------------------------------------------------
name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Allow deterministic manual dispatch. This repo has empirically shown that
  # pull_request/push events can occasionally fail to enqueue Actions runs
  # (stale refs/pull cache on force-pushed branches); workflow_dispatch is a
  # reliable fallback to trigger the gate via the REST API.
  workflow_dispatch:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ruff
        run: pip install ruff==0.15.22
      - name: Ruff lint (scoped to services/webinfer)
        # `--extend-ignore` adds to the repo-wide [tool.ruff.lint] select set
        # in pyproject.toml; it only suppresses the decorative historical-debt
        # rules measured in the enabling PR. Real-bug rules (F/E402/I/B/C4/SIM)
        # stay active.
        # UP007 was dropped: the Optional[X] -> X | None debt (86 sites) was
        # burned, so the rule no longer fires. RUF059/RUF046/RUF022 are new
        # decorative rules introduced by ruff 0.15.22 and are not real bugs.
        run: ruff check services/webinfer --extend-ignore RUF001,RUF003,D101,D102,D103,D205,D401,RUF005,RUF013,SIM105,SIM108,RUF059,RUF046,RUF022
      - name: Ruff format check (scoped to services/webinfer)
        run: ruff format --check services/webinfer

      # --- Phase 2 expansion: lint the remaining Python services -----------
      # Every package keeps the repo-wide real-bug rules (F/E402/I/B/C4/SIM/
      # N/RUF/UP/D) active; only its decorative historical-debt rules (measured
      # during the enabling pass) are suppressed via --extend-ignore. webui's
      # Python suite now carries its own [tool.ruff.lint] config (real-bug rules
      # enabled, docstring + other decorative debt ignored), so it is linted
      # directly from its pyproject without CLI --extend-ignore overrides.
      - name: Ruff lint (scoped to services/memory-store)
        run: ruff check services/memory-store --extend-ignore D101,D102,D103,RUF001,SIM105
      - name: Ruff format check (scoped to services/memory-store)
        run: ruff format --check services/memory-store
      - name: Ruff lint (scoped to services/voice-clone)
        run: ruff check services/voice-clone --extend-ignore RUF001,D102,D103,D105,D401,D205,SIM105
      - name: Ruff format check (scoped to services/voice-clone)
        run: ruff format --check services/voice-clone
      - name: Ruff lint (scoped to services/asr)
        run: ruff check services/asr --extend-ignore D103,D101,SIM105
      - name: Ruff format check (scoped to services/asr)
        run: ruff format --check services/asr
      - name: Ruff lint (scoped to services/tts)
        run: ruff check services/tts --extend-ignore D103,SIM105,D102,D101,RUF001
      - name: Ruff format check (scoped to services/tts)
        run: ruff format --check services/tts
      - name: Ruff lint (scoped to services/background-agent)
        run: ruff check services/background-agent --extend-ignore D101,D103,D102,D205
      - name: Ruff format check (scoped to services/background-agent)
        run: ruff format --check services/background-agent
      - name: Ruff lint (scoped to services/webui Python)
        # Run from services/webui so ruff resolves webui's OWN [tool.ruff.lint]
        # config (line-length=100, target py310) instead of the repo-root config.
        working-directory: services/webui
        run: ruff check .
      - name: Ruff format check (scoped to services/webui Python)
        working-directory: services/webui
        run: ruff format --check .

  drift-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run decision-contract checks (static subset, fail-closed)
        # D-019 v2 轻量门禁：仅跑静态 grep 子集（不需起服务），
        # 任一 [FAIL] 即非零退出、阻断合并；运行时/端口检查 fail-open（需起服务，本地跑）。
        run: bash scripts/verify.sh --ci

  # ---------------------------------------------------------------------------
  # drift-gate-runtime (Drift Gate v2.1 阶段A)：起 webui(:8099)+memory-store(:8997)
  # 两个 CPU-only 服务，跑全量 verify.sh，对这两服务的端口检查（含废弃 :8996
  # 反向断言）fail-closed，拦下 DRIFT-2/3 类"监听错端口"漂移。其余 6 个服务
  # (VLM/ASR/TTS/Hermes/background-agent 等) 在 CI 未起 -> [DOWN] 不计 fail
  # （沿用 check_port 语义）。详见 doc/adr/0015-drift-gate-runtime-v2.1.md 与
  # doc/specs/drift-gate-runtime-v2.1-spec.md。
  drift-gate-runtime:
    runs-on: ubuntu-latest
    needs: [drift-gate]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install memory-store (decision-state deps)
        run: |
          cd services/memory-store
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install webui Python deps
        run: |
          cd services/webui
          python -m pip install --upgrade pip
          pip install -e .

      # 起两服务 + 轮询 /health 就绪 + 跑全量校验，必须在同一 step 内完成，
      # 否则后台进程会在 step 结束时被回收，verify.sh 探不到端口 -> 误报。
      - name: Start services and run full drift verification (fail-closed)
        env:
          MEMORY_PORT: "8997"            # D-040/041 决策态端口（memory-store 默认是废弃 8996，须显式覆盖）
          MEMORY_HOST: "127.0.0.1"
          MEMORY_SQLITE_PATH: "/tmp/joyai-memory.sqlite"
          MEMORY_VEC_DIR: "/tmp/joyai-memory-vec"
          JOYAI_MEMORY_STORE_URL: "http://127.0.0.1:8997"   # D-032 webui 网关指向决策态 8997
        run: |
          set -u
          cd "$GITHUB_WORKSPACE"

          # 启动 memory-store（决策态 :8997）
          python -m memory_store.app > /tmp/memory-store.log 2>&1 &
          MS_PID=$!

          # 启动 webui（决策态 :8099；HTTP 不加 SSL 以便 /health 探测）
          ( cd services/webui && PYTHONPATH=src python -m joy_interaction_webui.server \
              --host 127.0.0.1 --port 8099 --no-ssl ) > /tmp/webui.log 2>&1 &
          WEBUI_PID=$!

          wait_for() {
            local url="$1" name="$2" deadline=$(( SECONDS + 30 ))
            echo "Waiting for ${name} at ${url} ..."
            while (( SECONDS < deadline )); do
              local code
              code=$(curl -s -o /dev/null -w "%{http_code}" -m 2 "$url" || true)
              if [ "$code" = "200" ]; then echo "Ready: ${name}"; return 0; fi
              if ! kill -0 "$MS_PID" 2>/dev/null; then
                echo "memory-store exited early"; echo "--- memory-store.log ---"; cat /tmp/memory-store.log; return 1
              fi
              if ! kill -0 "$WEBUI_PID" 2>/dev/null; then
                echo "webui exited early"; echo "--- webui.log ---"; cat /tmp/webui.log; return 1
              fi
              sleep 1
            done
            echo "TIMEOUT waiting for ${name} (${url})"
            echo "--- memory-store.log ---"; cat /tmp/memory-store.log
            echo "--- webui.log ---"; cat /tmp/webui.log
            return 1
          }

          wait_for "http://127.0.0.1:8997/health" "memory-store" || exit 1
          wait_for "http://127.0.0.1:8099/health" "webui" || exit 1

          # 全量校验（非 --ci）：webui/memory-store 端口检查 fail-closed；
          # 其余服务未起 -> [DOWN] 不计 fail。任何 [FAIL] -> 非零退出 -> 阻断合并。
          bash scripts/verify.sh
          RC=$?
          kill "$MS_PID" "$WEBUI_PID" 2>/dev/null || true
          exit $RC

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build backend
        run: python -m pip install --upgrade pip build
      - name: Build wheel
        working-directory: services/webinfer
        run: python -m build --wheel
      - name: Install wheel into a clean venv
        run: |
          python -m venv /tmp/webinfer-smoke-venv
          /tmp/webinfer-smoke-venv/bin/python -m pip install --upgrade pip
          /tmp/webinfer-smoke-venv/bin/python -m pip install services/webinfer/dist/*.whl
      - name: Import smoke test
        run: |
          /tmp/webinfer-smoke-venv/bin/python -c "import live_adapter; from live_adapter import StreamingInferAdapter, AdapterConfig"
          /tmp/webinfer-smoke-venv/bin/python -m pip show joyvl-webinfer-adapter
      - name: App construction smoke test
        run: /tmp/webinfer-smoke-venv/bin/python -c "from live_adapter import create_app, parse_args; app = create_app(parse_args()); assert app is not None"
      - name: Console script smoke test
        run: /tmp/webinfer-smoke-venv/bin/joyvl-webinfer-adapter --help

  eslint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run lint

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm test

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [memory-store, background-agent, webinfer]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          cd services/${{ matrix.service }}
          pip install --upgrade pip
          if [ "${{ matrix.service }}" = "webinfer" ]; then
            # webinfer declares its runtime + dev deps in its own pyproject;
            # install editable so the suite imports the checked-out source
            # (aiohttp, aiohttp-cors, Pillow, openai, httpx, pytest,
            # pytest-asyncio) rather than the shared lightweight set below.
            pip install -e ".[dev]"
          elif [ "${{ matrix.service }}" = "memory-store" ]; then
            # memory-store declares usearch + numpy (ADR-0012 vector recall) in
            # its own pyproject; editable install pulls them in alongside pytest.
            pip install -e ".[dev]"
          else
            pip install fastapi pydantic "uvicorn[standard]" httpx pytest pytest-asyncio
          fi
      - name: Run pytest
        run: |
          cd services/${{ matrix.service }}
          python -m pytest -o asyncio_mode=auto -q
